<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptShield</title>
    <meta name="description" content="PromptShield stops prompt injection attacks before they reach an AI assistant, in four layers." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5 4 5.6v6.1c0 4.9 3.3 8.4 8 9.8 4.7-1.4 8-4.9 8-9.8V5.6L12 2.5Z' fill='%2316213A'/%3E%3Cpath d='M8.4 12.2 11 14.7l4.8-5.2' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply a saved theme before the first paint, so dark mode never flashes light.
      try {
        if (localStorage.getItem('promptshield-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) { /* storage blocked */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
